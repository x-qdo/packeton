version: '3.6'

services:
    postgres:
        image: postgres:15-alpine
        container_name: packeton-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: packeton
            POSTGRES_PASSWORD: packeton
            POSTGRES_DB: packeton
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U packeton"]
            interval: 5s
            timeout: 5s
            retries: 5

    packagist:
        build:
            context: .
        image: packeton/packeton:latest
        restart: unless-stopped
        container_name: packagist
        hostname: packagist
        depends_on:
            postgres:
                condition: service_healthy
        environment:
#            ADMIN_USER: admin
#            ADMIN_PASSWORD: 123456
#            ADMIN_EMAIL: admin@example.com
            TRUSTED_PROXIES: 172.16.0.0/12
            DATABASE_URL: "postgresql://packeton:packeton@postgres:5432/packeton?serverVersion=15&charset=utf8"

#            MAILER_DSN: smtp://user:pass@smtp.mailgun.org:587
#            MAILER_FROM: Packeton <packeton@example.com>
        ports:
#            setup nginx reverse proxy for ssl
            - '127.0.0.1:8088:80'
        volumes:
            - .docker:/data
            - ./src:/var/www/packagist/src
            - ./templates:/var/www/packagist/templates
            - ./docs:/var/www/packagist/docs
            - ./config:/var/www/packagist/config

volumes:
    postgres_data:
